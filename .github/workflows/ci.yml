name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio httpx fastapi sqlalchemy pydantic-settings redis python-dotenv

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

  build-and-verify:
    name: Package Build & Wheel Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build Wheel and Source Distribution
        run: |
          python -m build

      - name: Verify Wheel Install in Clean Environment
        run: |
          python -m venv test_env
          ./test_env/bin/pip install --upgrade pip
          ./test_env/bin/pip install $(find dist -name "*.whl" | head -n 1)
          ./test_env/bin/python -c "import intelligent_cache; print('Successfully imported intelligent-cache:', intelligent_cache.__version__)"
          ./test_env/bin/python -c "from intelligent_cache import IntelligentCache; cache = IntelligentCache(); cache.set('k', 'v'); assert cache.get('k').value == 'v'"
